services:
  subtrack:
    build:
      context: .
      dockerfile: Dockerfile
    image: subtrack:latest
    container_name: subtrack
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/subscriptions.db
